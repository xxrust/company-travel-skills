name: validate-skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyyaml openpyxl
      - run: python scripts/validate_skills.py
      - run: python -m py_compile skills/*/scripts/*.py
      - run: python skills/company-expense-reimbursement/scripts/build_template.py --output .tmp/company-expense-template.xlsx
