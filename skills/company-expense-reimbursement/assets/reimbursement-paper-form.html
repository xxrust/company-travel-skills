<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>差旅费报销单</title>
  <style>
    /* ── 色彩令牌 ─────────────────────────────────────────── */
    :root {
      --ink:      #1a3d6e;
      --border:   #2a5fa8;
      --border-d: #6b9fd4;
      --text:     #0d0d0d;
      --bg:       #ffffff;
    }

    /* ── 基础重置 ─────────────────────────────────────────── */
    @page { size: 215mm 108mm; margin: 2mm; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #d8e4f0; }
    body { font-family: "Microsoft YaHei", "SimHei", "SimSun", sans-serif; }

    /* ── 纸张 ─────────────────────────────────────────────── */
    .paper {
      width: 211mm;
      margin: 0 auto 6mm;
      background: var(--bg);
      border: .35mm solid var(--border);
      page-break-after: always;
    }
    .paper:last-child { page-break-after: auto; margin-bottom: 0; }

    /* ── 顶部：大标题 + 日期 + 预领款框 ──────────────────── */
    .top {
      display: grid;
      grid-template-columns: 1fr 44mm;
      border-bottom: .35mm solid var(--border);
    }
    .title-block {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 1mm 0 .8mm;
    }
    .title-block h1 {
      font-size: 13pt; font-weight: 700;
      letter-spacing: 3mm; color: var(--ink);
    }
    .form-date {
      margin-top: .5mm; font-size: 6pt;
      color: var(--ink); letter-spacing: 2mm;
    }

    /* 预领款 / 补款或缴还 */
    .advance-box {
      border-left: .35mm solid var(--border);
      display: grid; grid-template-rows: 1fr 1fr;
    }
    .advance-row {
      display: grid; grid-template-columns: 18mm 1fr;
      align-items: center;
      border-bottom: .35mm solid var(--border);
      font-size: 5.5pt; color: var(--ink);
    }
    .advance-row:last-child { border-bottom: none; }
    .advance-row .alabel { text-align: center; padding: .4mm; white-space: nowrap; }
    .advance-row .aval {
      border-left: .35mm solid var(--border);
      min-height: 4.5mm; padding: .4mm 1mm;
      font-size: 6.5pt; color: var(--text);
      font-family: "Courier New", monospace;
    }

    /* ── 元信息区 ─────────────────────────────────────────── */
    .row-dept {
      display: flex; align-items: center;
      min-height: 5mm; padding: .4mm 1.5mm;
      border-bottom: .35mm solid var(--border);
      font-size: 6pt; color: var(--ink); gap: 1mm;
    }
    .row-dept .label { white-space: nowrap; }
    .row-dept .val {
      flex: 1; border-bottom: .3mm solid var(--ink);
      min-height: 3mm; padding: 0 .5mm; color: var(--text); font-size: 6.5pt;
    }

    .row-identity {
      display: grid; grid-template-columns: 40mm 40mm 1fr;
      border-bottom: .35mm solid var(--border); min-height: 5.5mm;
    }
    .row-trip {
      display: grid; grid-template-columns: 1fr 20mm 25mm;
      border-bottom: .35mm solid var(--border); min-height: 5.5mm;
    }

    .cell {
      display: grid; grid-template-columns: auto 1fr;
      align-items: stretch; border-right: .35mm solid var(--border);
    }
    .cell:last-child { border-right: none; }
    .cell .cl {
      display: flex; align-items: center; justify-content: center;
      padding: .4mm .8mm; white-space: pre; font-size: 5.5pt;
      color: var(--ink); border-right: .35mm solid var(--border);
      text-align: center; line-height: 1.3;
    }
    .cell .cv {
      display: flex; align-items: center;
      padding: .4mm 1.5mm; font-size: 6.5pt;
      color: var(--text); min-width: 0; overflow-wrap: anywhere;
    }

    .cell-days {
      display: grid; grid-template-columns: 5mm 1fr 5mm;
      align-items: center; border-right: .35mm solid var(--border);
    }
    .cell-days:last-child { border-right: none; }
    .cell-days .dl, .cell-days .dr {
      display: flex; align-items: center; justify-content: center;
      font-size: 5.5pt; color: var(--ink); height: 100%;
    }
    .cell-days .dr { border-left: .35mm solid var(--border); }
    .cell-days .dv {
      display: flex; align-items: center; justify-content: center;
      font-size: 6.5pt; color: var(--text);
    }

    /* ── 明细表 ───────────────────────────────────────────── */
    table.expenses {
      width: 204mm; table-layout: fixed; border-collapse: collapse;
    }
    /* 列宽合计 = 204mm */
    col.c-date      { width: 14mm; }
    col.c-location  { width: 42mm; }
    col.c-vname     { width: 13mm; }
    col.c-vamt      { width: 15mm; }
    col.c-hotel     { width: 20mm; }
    col.c-allowance { width: 14mm; }
    col.c-local     { width: 20mm; }
    col.c-mname     { width: 14mm; }
    col.c-mamt      { width: 18mm; }
    col.c-note      { width: 34mm; }

    .expenses thead th {
      border: .3mm solid var(--border); padding: .5mm .3mm;
      font-size: 6pt; font-weight: 700; color: var(--ink);
      text-align: center; vertical-align: middle;
      background: var(--bg); line-height: 1.25;
    }

    .expenses tbody td {
      height: 6mm; font-size: 6.5pt; color: var(--text);
      padding: .3mm; text-align: center; vertical-align: middle;
      border-top:    .25mm solid var(--border);
      border-bottom: .25mm solid var(--border);
      border-left:   .25mm dashed var(--border-d);
      border-right:  .25mm dashed var(--border-d);
    }
    .expenses tbody td:first-child { border-left:  .3mm solid var(--border); }
    .expenses tbody td:last-child  { border-right: .3mm solid var(--border); }

    .expenses td.c-date     { font-size: 6pt; line-height: 1.3; }
    .expenses td.c-location,
    .expenses td.c-vname,
    .expenses td.c-mname,
    .expenses td.c-note     { text-align: left; padding-left: 1mm; }
    .expenses td.c-vamt,
    .expenses td.c-hotel,
    .expenses td.c-local,
    .expenses td.c-mamt     {
      text-align: right; padding-right: 1mm;
      font-family: "Courier New", monospace;
    }

    .expenses tfoot td {
      height: 5.5mm; font-size: 6.5pt; font-weight: 700; color: var(--ink);
      border: .3mm solid var(--border); padding: .3mm;
      text-align: center; vertical-align: middle;
    }
    .expenses tfoot .total-label { text-align: left; padding-left: 1.5mm; }
    .expenses tfoot td.c-vamt,
    .expenses tfoot td.c-hotel,
    .expenses tfoot td.c-local,
    .expenses tfoot td.c-mamt {
      text-align: right; padding-right: 1mm;
      font-family: "Courier New", monospace; color: var(--text);
    }

    /* ── 大写金额行（含 ¥：） ────────────────────────────── */
    .row-uppercase {
      display: grid; grid-template-columns: 36mm 1fr 16mm;
      min-height: 6mm; border-bottom: .35mm solid var(--border); font-size: 6.5pt;
    }
    .row-uppercase > * {
      display: flex; align-items: center; padding: .5mm 1.5mm;
      border-right: .35mm solid var(--border); color: var(--ink);
    }
    .row-uppercase > :last-child {
      border-right: none; font-size: 8pt; font-weight: 700;
    }
    .row-uppercase .uc-val { color: var(--text); }

    /* ── 签名行 ───────────────────────────────────────────── */
    .row-signatures {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      min-height: 6mm; font-size: 6.5pt; color: var(--ink);
    }
    .row-signatures div {
      display: flex; align-items: center; padding: 1mm 1.5mm;
    }

    /* ── 屏幕预览 ─────────────────────────────────────────── */
    @media screen {
      body { padding: 8mm 0; }
      .paper { box-shadow: 0 1mm 4mm #0003; }
    }

    /* ── 打印 ─────────────────────────────────────────────── */
    @media print {
      html, body { background: white; }
      body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .paper { margin: 0; box-shadow: none; border: none; }
    }
  </style>
</head>
<body>
$pages
</body>
</html>
